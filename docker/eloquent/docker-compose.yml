services:
  ollama:
    image: ollama/ollama:latest
    container_name: inova-eloquent-ollama
    restart: unless-stopped
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      ELOQUENT_MODEL: ${ELOQUENT_MODEL:-gemma3:4b}
    entrypoint: ['/bin/sh', '-c', 'ollama pull "$$ELOQUENT_MODEL"']
    restart: 'no'

volumes:
  ollama_data:
    name: inova_eloquent_ollama
