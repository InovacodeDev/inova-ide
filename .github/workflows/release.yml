name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: ver
        run: |
          VERSION="$(node scripts/version.mjs check --tag "${GITHUB_REF_NAME}")"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

  build:
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: mac-arm64
            platform: darwin
            arch: arm64
            os: macos-15
          - target: win-x64
            platform: win32
            arch: x64
            os: windows-latest
          - target: linux-x64
            platform: linux
            arch: x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify version tag
        shell: bash
        run: pnpm version:check --tag "${GITHUB_REF_NAME}"
      - name: Run checks (macOS)
        if: runner.os == 'macOS'
        run: |
          pnpm typecheck && pnpm lint && pnpm test
          pnpm --filter @inova/desktop typecheck && pnpm --filter @inova/desktop test
      - name: Run checks (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update && sudo apt-get install -y xvfb
          fi
          pnpm typecheck && pnpm lint && pnpm test
          pnpm --filter @inova/desktop typecheck
          xvfb-run -a pnpm --filter @inova/desktop test
      - name: Run checks (Windows)
        if: runner.os == 'Windows'
        run: |
          pnpm typecheck && pnpm lint
          pnpm --filter @inova/desktop typecheck
          pnpm --filter @inova/desktop build
          pnpm --filter @inova/desktop exec vitest run test/selftest.test.ts
      - name: Package ${{ matrix.target }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node apps/desktop/scripts/package.mjs --platform "${{ matrix.platform }}" --arch "${{ matrix.arch }}"
      - name: Smoke test macOS DMG
        if: runner.os == 'macOS'
        run: |
          zsh apps/desktop/scripts/smoke-dmg.sh \
            "release/InovaIDE-${{ needs.validate.outputs.version }}-arm64.dmg" \
            "${{ needs.validate.outputs.version }}"
      - name: Smoke test Linux tar.gz
        if: runner.os == 'Linux'
        run: |
          sh apps/desktop/scripts/smoke-linux.sh \
            "release/InovaIDE-${{ needs.validate.outputs.version }}-linux-x64.tar.gz" \
            "${{ needs.validate.outputs.version }}"
      - name: Smoke test Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          apps/desktop/scripts/smoke-win.ps1 `
            -ZipPath "release/InovaIDE-${{ needs.validate.outputs.version }}-win-x64.zip" `
            -ExpectedVersion "${{ needs.validate.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  publish-release:
    needs: [validate, build]
    runs-on: ubuntu-latest
    outputs:
      arm64_sha256: ${{ steps.hashes.outputs.arm64 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - id: hashes
        run: |
          ARM_SHA="$(awk '{print $1}' "release-assets/InovaIDE-${{ needs.validate.outputs.version }}-arm64.dmg.sha256")"
          echo "arm64=${ARM_SHA}" >> "${GITHUB_OUTPUT}"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            release-assets/* \
            --title "InovaIDE ${GITHUB_REF_NAME}" \
            --generate-notes

  update-homebrew-tap:
    needs: [validate, publish-release]
    runs-on: macos-15
    steps:
      - name: Check tap token
        id: check
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "HOMEBREW_TAP_TOKEN not configured; skipping tap update."
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          repository: InovacodeDev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update Cask and verify with brew
        if: steps.check.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARM_SHA: ${{ needs.publish-release.outputs.arm64_sha256 }}
        run: |
          CASK="homebrew-tap/Casks/inova-ide.rb"
          ruby -e 'c = File.read(ARGV[0]).sub(/version "[^"]+"/, %(version "#{ARGV[1]}")).sub(/sha256 "[^"]+"/, %(sha256 "#{ARGV[2]}")); File.write(ARGV[0], c)' "${CASK}" "${VERSION}" "${ARM_SHA}"
          brew style "${CASK}"
          TAP_DIR="$(brew --repository)/Library/Taps/inovacodedev"
          mkdir -p "${TAP_DIR}"
          ln -sfn "${PWD}/homebrew-tap" "${TAP_DIR}/homebrew-tap"
          brew trust inovacodedev/tap
          brew audit --cask --online inovacodedev/tap/inova-ide
      - name: Commit and push tap update
        if: steps.check.outputs.enabled == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/inova-ide.rb
          git commit -m "inova-ide ${VERSION}"
          git push origin HEAD:main
