appId: com.inovacode.inova-ide
productName: InovaIDE
copyright: Copyright © 2026 InovacodeDev
npmRebuild: false
directories:
  output: dist-electron
  buildResources: build
files:
  - out/**/*
  - package.json
  - node_modules/**/*
  - '!node_modules/.bin'
asar: true
asarUnpack:
  - '**/node_modules/node-pty/**'
extraResources:
  - from: cli
    to: cli
  - from: resources/bin
    to: bin
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: InovaIDE-${version}-${arch}.${ext}
  target:
    - dmg
dmg:
  title: InovaIDE ${version}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  icon: build/icon.ico
  artifactName: InovaIDE-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  category: Development
  icon: build/icon.png
  executableName: inova-ide
  maintainer: InovacodeDev <tito@inovacode.dev>
  artifactName: InovaIDE-${version}-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
afterPack: ./scripts/after-pack.mjs
